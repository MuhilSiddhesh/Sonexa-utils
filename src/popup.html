<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonexa and Vedra Utils</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Sonexa and Vedra Utils</h1>
    <p class="guide-link"><a href="guide.html" target="_blank">📖 View Setup Guide</a></p>
    
    <div class="service-section">
      <h2>YouTube Music</h2>
      <div class="format-selector">
        <label for="format-select">Format:</label>
        <select id="format-select">
          <option value="string">String Format</option>
          <option value="netscape">Netscape Format</option>
        </select>
      </div>
      <div class="buttons">
        <button id="extract-youtube-music">Extract Cookies</button>
        <button id="copy-youtube-music" disabled>Copy to Clipboard</button>
        <button id="push-youtube-music" disabled>Push to Gist</button>
      </div>
      <div class="result">
        <textarea id="youtube-music-result" readonly></textarea>
      </div>
    </div>
    
    <div class="service-section">
      <h2>Spotify (sp_dc)</h2>
      <div class="buttons">
        <button id="extract-spotify">Extract Cookie</button>
        <button id="copy-spotify" disabled>Copy to Clipboard</button>
        <button id="push-spotify" disabled>Push to Gist</button>
      </div>
      <div class="result">
        <textarea id="spotify-result" readonly></textarea>
      </div>
    </div>
    
    <div class="service-section gist-section">
      <h2>GitHub Gist</h2>
      <div class="format-selector">
        <label for="gist-token">GitHub Token:</label>
        <input type="password" id="gist-token" placeholder="Enter GitHub Personal Access Token">
      </div>
      <div class="buttons">
        <button id="save-gist-token">Save Token</button>
      </div>
    </div>
    
    <div id="status" class="status"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
